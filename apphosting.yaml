# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  # Set the timeout for the server to 2 minutes to allow for video generation
  timeoutSeconds: 120
# This section makes secrets from Google Cloud Secret Manager available as
# environment variables to your running application.
secretEnvironmentVariables:
  - key: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    # By default, the latest version of the secret is used. You can specify a
    # specific version if needed, e.g., "version: 2"
